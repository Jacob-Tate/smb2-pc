name: Relay server

on:
  push:
    branches: [online]
    paths:
      - 'server/**'
      - 'include/netplay/**'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/smb2-server

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Validate Swarm/Portainer stack file
        run: docker compose -f server/portainer-stack.yml config --quiet

      - name: Build image
        run: docker build -f server/Dockerfile -t smb2-server .

      - name: Start server container
        run: |
          docker run -d --name smb2server -p 7855:7855/udp smb2-server
          sleep 2
          docker logs smb2server

      - name: Integration test against the container
        run: |
          docker run --rm --network host --entrypoint smb2-server-test smb2-server 127.0.0.1 7855

      - name: Server log
        if: always()
        run: docker logs smb2server

      - name: Image size
        run: docker image ls smb2-server

      # Publish only tested images (this workflow only runs on the online branch or by hand).
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/online'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish to ghcr.io
        if: github.ref == 'refs/heads/online'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          for tag in latest "$SHORT_SHA"; do
            docker tag smb2-server "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Published $IMAGE:latest and $IMAGE:$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
